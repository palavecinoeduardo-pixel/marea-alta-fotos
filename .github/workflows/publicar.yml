name: Publicar en Instagram

on:
  schedule:
    # 22:00 UTC = 19:00 en Argentina. GitHub puede demorarse unos minutos.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a publicar (AAAA-MM-DD). Vacío = hoy"
        required: false

permissions:
  contents: write

concurrency:
  group: publicar-instagram

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar la foto del día
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FECHA: ${{ github.event.inputs.fecha }}
        run: python3 scripts/publicar.py

      - name: Registrar lo publicado
        run: |
          if [ -n "$(git status --porcelain publicados.txt 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publicados.txt
            git commit -m "Registro de publicación"
            git push
          fi
